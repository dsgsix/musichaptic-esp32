; Abra esta carpeta (la que contiene platformio.ini) en VS Code.
[platformio]
default_envs = esp32_brazalete

[env:esp32_brazalete]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
; Si hay varios dispositivos, quitar el punto y coma y elegir el puerto real:
; upload_port = COM3
; monitor_port = COM3
